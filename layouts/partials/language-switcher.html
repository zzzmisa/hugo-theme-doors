<nav class="language-switcher" aria-label="{{ .Site.Params.languageSelector }}">
  <details>
    <summary aria-label="{{ .Site.Params.languageSelector }}">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" focusable="false"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 6h-3.1a15.7 15.7 0 0 0-1.1-3.4A8.1 8.1 0 0 1 18.9 8ZM12 4c.8 1.1 1.5 2.5 1.8 4h-3.6c.3-1.5 1-2.9 1.8-4ZM4.3 14a8 8 0 0 1 0-4h3.4a16.4 16.4 0 0 0 0 4H4.3Zm.8 2h3.1a15.7 15.7 0 0 0 1.1 3.4A8.1 8.1 0 0 1 5.1 16Zm3.1-8H5.1a8.1 8.1 0 0 1 4.2-3.4A15.7 15.7 0 0 0 8.2 8Zm3.8 12c-.8-1.1-1.5-2.5-1.8-4h3.6c-.3-1.5-1-2.9-1.8-4Zm2.3-6h-4.6a14.5 14.5 0 0 1 0-4h4.6a14.5 14.5 0 0 1 0 4Zm.4 5.4a15.7 15.7 0 0 0 1.1-3.4h3.1a8.1 8.1 0 0 1-4.2 3.4Zm1.6-5.4a16.4 16.4 0 0 0 0-4h3.4a8 8 0 0 1 0 4h-3.4Z"/></svg>
      <span>{{ .Site.Language.Label }}</span>
    </summary>
    <div class="language-switcher__menu">
      {{- range .AllTranslations }}
        {{- if eq $.Lang .Lang }}
          <span aria-current="page">{{ .Language.Label }}</span>
        {{- else }}
          <a href="{{ .RelPermalink }}" hreflang="{{ .Language.Locale }}" lang="{{ .Language.Locale }}">{{ .Language.Label }}</a>
        {{- end }}
      {{- end }}
    </div>
  </details>
</nav>
