{{ $contactAtTop := eq (default "footer" .Site.Params.contact.position) "top" }}
{{ if not $contactAtTop }}
  {{ partial "contact-profile.html" . }}
{{ end }}
<footer class="site-footer site-copyright">
  {{ with .Site.Params.footer.links }}
    <nav class="footer-nav">
      <ul class="footer-links">
        {{ range . }}
          <li><a href="{{ .url }}">{{ .label }}</a></li>
        {{ end }}
      </ul>
    </nav>
  {{ end }}
  <small>{{ .Site.Copyright }}</small>
</footer>
