{{ with .Site.Params.contact }}
  {{ $contactAtTop := eq (default "footer" $.Site.Params.contact.position) "top" }}
  <section class="site-footer site-profile{{ if not $contactAtTop }} site-profile--bottom{{ end }}"{{ with .name }} aria-labelledby="profile-name"{{ end }}>
    {{ partial "contact-profile-content.html" $ }}
  </section>
{{ end }}
